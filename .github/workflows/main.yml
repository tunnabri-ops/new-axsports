name: Auto Update AXSports

on:
  schedule:
    # প্রতি ৫ মিনিট পর পর স্বয়ংক্রিয়ভাবে চেক ও আপডেট করবে
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AXSports files
        run: |
          # axsports_bd.m3u ফাইল ডাউনলোড (404 এরর এড়াতে --fail ব্যবহার করা হয়েছে)
          curl -sL --fail "https://raw.githubusercontent.com/srhady/axsports/main/axsports_bd.m3u" -o axsports.m3u || \
          curl -sL "https://raw.githubusercontent.com/srhady/axsports/main/axsports.m3u" -o axsports.m3u

          # json ফাইল ডাউনলোড
          curl -sL --fail "https://raw.githubusercontent.com/srhady/axsports/main/axsports_bd.json" -o axsports.json || \
          curl -sL "https://raw.githubusercontent.com/srhady/axsports/main/axsports.json" -o axsports.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "Auto update: $(date)" && git push)
